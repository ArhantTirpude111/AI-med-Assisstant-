[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medintel"
version = "1.0.0"
description = "MedIntel AI — Retrieval-Augmented Medical Report Analysis Assistant"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MedIntel AI" }]
keywords = ["rag", "medical", "llm", "healthcare", "faiss", "langchain", "ocr"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    # --- Core app & data ---
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "pandas>=2.1",
    "numpy>=1.26",
    "tenacity>=8.2",
    # --- RAG / LLM ---
    "openai>=1.30",
    "faiss-cpu>=1.7.4",
    "langchain>=0.2",
    "langchain-text-splitters>=0.2",
    "tiktoken>=0.6",
    # --- Document ingestion ---
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "pillow>=10.2",
    # --- UI & viz ---
    "streamlit>=1.34",
    "networkx>=3.2",
    "plotly>=5.20",
    # --- Persistence ---
    "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
# Heavy / optional capabilities. `pip install -e ".[full]"`
ocr = ["pytesseract>=0.3.10"]
viz = ["pyvis>=0.3.2"]
local-embeddings = ["sentence-transformers>=2.7"]
# Free, offline LLM (no API key). Pulls torch + transformers.
local-llm = ["transformers>=4.40", "torch>=2.2", "accelerate>=0.30"]
# Medical NER. SciSpaCy models are installed separately (see docs/DEPLOYMENT.md).
ner = ["spacy>=3.7", "scispacy>=0.5.4"]
full = [
    "pytesseract>=0.3.10",
    "pyvis>=0.3.2",
    "sentence-transformers>=2.7",
    "spacy>=3.7",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
medintel = "medintel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
medintel = ["py.typed"]

# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests that exercise the full pipeline",
]
